<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Al Pastificio</title>

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Open+Sans:wght@400;600&display=swap"
        rel="stylesheet"
    >

    <!-- CSS PRINCIPAL -->
    <link rel="stylesheet" href="home.css">

</head>


<body>


    <main class="home">


        <!-- =================================
             CAPA 1
             IMAGEN DE FONDO
        ================================== -->

        <div class="fondo"></div>


        <!-- =================================
             CAPA 2
             RECTÁNGULO SUPERIOR
        ================================== -->

        <div class="rectangulo-superior"></div>


        <!-- =================================
             CAPA 2
             RECTÁNGULO INFERIOR
        ================================== -->

        <div class="rectangulo-inferior"></div>


        <!-- =================================
             CAPA 3
             BOTONES DE IDIOMA
        ================================== -->

        <div class="idiomas">

            <a
                class="btn"
                href="menu-es.html"
            >
                🇪🇸 Español
            </a>


            <a
                class="btn"
                href="menu-en.html"
            >
                🇺🇸 English
            </a>

        </div>


        <!-- =================================
             CAPA 4
             LOGO + TEXTOS + DECORACIÓN
        ================================== -->

        <div class="contenido">


            <!-- LOGO -->

            <img
                src="media/logo web.png"
                alt="Al Pastificio - Comida de Italia"
                class="logo"
            >


            <!-- BIENVENIDO -->

            <h1>
                Bienvenido
            </h1>


            <!-- DECORACIÓN -->

            <div class="decoracion">

                <span></span>

            </div>


            <!-- TEXTO INFERIOR -->

            <div class="detalle">

                Auténtica comida italiana

            </div>


        </div>


        <!-- =================================
             CAPA 7
             REDES SOCIALES
        ================================== -->

        <section class="redes">


            <h2 class="titulo-redes">
                Síguenos
            </h2>


            <div class="redes-grid">


                <!-- =================================
                     INSTAGRAM
                ================================== -->

                <a
                    href="https://www.instagram.com/alpastificio/"
                    class="red-social"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <div class="red-social-icono">

                        <img
                            src="media/instagram.png"
                            alt="Instagram"
                        >

                    </div>


                    <div class="red-social-info">

                        <h3>
                            Instagram
                        </h3>

                    </div>

                </a>


                <!-- =================================
                     FACEBOOK
                ================================== -->

                <a
                    href="https://www.facebook.com/profile.php?id=61591106557428"
                    class="red-social"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <div class="red-social-icono">

                        <img
                            src="media/facebook.png"
                            alt="Facebook"
                        >

                    </div>


                    <div class="red-social-info">

                        <h3>
                            Facebook
                        </h3>

                    </div>

                </a>


                <!-- =================================
                     TIKTOK
                ================================== -->

                <a
                    href="https://www.tiktok.com/@al.pastificio"
                    class="red-social"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <div class="red-social-icono">

                        <img
                            src="media/tiktok.png"
                            alt="TikTok"
                        >

                    </div>


                    <div class="red-social-info">

                        <h3>
                            TikTok
                        </h3>

                    </div>

                </a>


                <!-- =================================
                     WHATSAPP
                ================================== -->

                <a
                    href="https://wa.me/573044861540"
                    class="red-social"
                    target="_blank"
                    rel="noopener noreferrer"
                >

                    <div class="red-social-icono">

                        <img
                            src="media/whatsapp.png"
                            alt="WhatsApp"
                        >

                    </div>


                    <div class="red-social-info">

                        <h3>
                            WhatsApp
                        </h3>

                    </div>

                </a>


            </div>


        </section>


    </main>


</body>

</html>
